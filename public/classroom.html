<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصل الدراسي - LisanTest.com</title>
    <meta name="description" content="المواد التعليمية والفيديوهات الخاصة بالطلاب المقبولين">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              flag: {
                black: '#0E2A4C', blacksoft: '#163B63', charcoal: '#1F4C78',
                red: '#2563EB', redbright: '#3B82F6', reddeep: '#1D4ED8',
                gold: '#38BDF8', goldsoft: '#7DD3FC',
                accent: '#FF7A45', accentbright: '#FF9466', accentdeep: '#E85A2A',
                cream: '#F5F8FC', paper: '#FFFFFF', ink: '#1E293B'
              }
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              arabic: ['Cairo', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Supabase client (must load before Alpine, since x-init calls into it) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none !important;}</style>
</head>
<body class="font-arabic de-paper-bg text-flag-ink antialiased min-h-screen" x-data="classroomApp()" x-init="init()">

    <!-- ============ LOADING ============ -->
    <div x-show="!authChecked" class="min-h-screen flex items-center justify-center de-dark-bg text-white">
        <i class="fas fa-circle-notch fa-spin text-2xl"></i>
    </div>

    <!-- ============ MEMBERSHIP GATE (pending / rejected) ============ -->
    <template x-if="authChecked && user && gateStatus !== 'ok'">
        <div class="min-h-screen de-dark-bg flex items-center justify-center p-4">
            <div class="de-card w-full max-w-md overflow-hidden text-center">
                <div class="de-flag-ribbon"></div>
                <div class="p-8">
                    <template x-if="gateStatus === 'pending'">
                        <div>
                            <span class="de-stamp de-stamp-onlight h-16 w-16 text-xs mx-auto mb-5"><i class="fas fa-lock"></i></span>
                            <h1 class="font-display text-xl font-bold text-flag-ink mb-3">ميزة للمشتركين فقط</h1>
                            <p class="text-sm text-flag-ink/60 leading-relaxed mb-6">
                                الفصل الدراسي (المواد التعليمية والفيديوهات) متاح حصريًا للمشتركين. أنت حاليًا على الخطة المجانية — اشترك مقابل 200 درهم شهريًا للوصول الكامل.
                            </p>
                        </div>
                    </template>
                    <template x-if="gateStatus === 'rejected'">
                        <div>
                            <span class="de-stamp h-16 w-16 text-xs mx-auto mb-5" style="border-color:#DC2626;color:#DC2626;"><i class="fas fa-circle-xmark"></i></span>
                            <h1 class="font-display text-xl font-bold text-flag-ink mb-3">تعذّر تفعيل حسابك</h1>
                            <p class="text-sm text-flag-ink/60 leading-relaxed mb-6">
                                لم تتم الموافقة على عضويتك. تواصل معنا على
                                <a href="mailto:hello@lisantest.com" class="text-flag-red">hello@lisantest.com</a>
                                لمزيد من المعلومات.
                            </p>
                        </div>
                    </template>
                    <a href="dashboard.html" class="de-btn w-full text-sm py-3" style="background:#EEEAE0;color:#1E293B;">
                        <i class="fas fa-arrow-right"></i> العودة إلى لوحة التحكم
                    </a>
                </div>
            </div>
        </div>
    </template>

    <!-- ============ CLASSROOM ============ -->
    <template x-if="authChecked && user && gateStatus === 'ok'">
        <div>
            <!-- Header -->
            <header class="sticky top-0 z-30">
                <div class="de-light-bg text-flag-ink shadow-sm border-b border-black/5">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-16 gap-3">
                            <a href="dashboard.html" class="flex items-center gap-3 flex-shrink-0">
                                <span class="de-stamp de-stamp-onlight h-10 w-10 text-xs"><i class="fas fa-chalkboard"></i></span>
                                <span class="font-display font-semibold hidden lg:block">الفصل الدراسي</span>
                            </a>

                            <!-- Search (centered, dropdown appears on focus) -->
                            <div class="flex-1 max-w-md relative" @click.outside="searchOpen = false">
                                <div class="relative">
                                    <i class="fas fa-search absolute top-1/2 -translate-y-1/2 start-3.5 text-flag-ink/30 text-sm"></i>
                                    <input type="text" x-model="searchQuery" x-ref="searchInput"
                                           @focus="searchOpen = true" @keydown.escape="searchOpen = false; $refs.searchInput.blur()"
                                           placeholder="ابحث في الفصل الدراسي..."
                                           class="w-full ps-10 pe-4 py-2 rounded-full border border-black/10 text-sm focus:outline-none focus:ring-2 focus:ring-flag-red/30 bg-flag-cream/60 focus:bg-white transition-colors">
                                </div>

                                <div x-show="searchOpen" x-cloak x-transition
                                     class="absolute top-full mt-2 start-0 w-full sm:w-96 de-card rounded-2xl overflow-hidden z-50 max-h-[70vh] flex flex-col">
                                    <!-- Filters, revealed once the student starts typing -->
                                    <div class="p-3 border-b border-black/5" x-show="searchQuery.trim() !== ''" x-cloak>
                                        <div class="flex flex-wrap gap-1.5 mb-2">
                                            <button @click="selectedType = 'all'" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors"
                                                    :class="selectedType === 'all' ? 'bg-flag-black text-white' : 'bg-flag-cream text-flag-ink/60'">الكل</button>
                                            <button @click="selectedType = 'pdf'" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors"
                                                    :class="selectedType === 'pdf' ? 'bg-flag-black text-white' : 'bg-flag-cream text-flag-ink/60'"><i class="fas fa-file-pdf"></i> PDF</button>
                                            <button @click="selectedType = 'youtube'" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors"
                                                    :class="selectedType === 'youtube' ? 'bg-flag-black text-white' : 'bg-flag-cream text-flag-ink/60'"><i class="fab fa-youtube"></i> فيديو</button>
                                        </div>
                                        <div class="flex flex-wrap gap-1.5" x-show="categories.length > 0">
                                            <button @click="selectedCategory = 'all'" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors"
                                                    :class="selectedCategory === 'all' ? 'bg-flag-red text-white' : 'bg-flag-cream text-flag-ink/60'">كل التصنيفات</button>
                                            <template x-for="cat in categories" :key="cat">
                                                <button @click="selectedCategory = cat" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors"
                                                        :class="selectedCategory === cat ? 'bg-flag-red text-white' : 'bg-flag-cream text-flag-ink/60'" x-text="cat"></button>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Live results -->
                                    <div class="overflow-y-auto flex-1">
                                        <template x-for="r in searchResults" :key="r.id">
                                            <button @click="selectSearchResult(r)" class="w-full text-start p-3 flex items-center gap-3 hover:bg-flag-cream/60 transition-colors border-b border-black/5 last:border-0">
                                                <span class="h-9 w-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                                      :class="r.type === 'pdf' ? 'bg-flag-red/10 text-flag-red' : 'bg-red-50 text-red-600'">
                                                    <i :class="r.type === 'pdf' ? 'fas fa-file-pdf' : 'fab fa-youtube'"></i>
                                                </span>
                                                <div class="min-w-0">
                                                    <div class="text-sm font-medium text-flag-ink truncate" x-text="r.title"></div>
                                                    <div class="text-xs text-flag-ink/40 truncate" x-text="r.category || (r.type === 'pdf' ? 'ملف PDF' : 'فيديو')"></div>
                                                </div>
                                            </button>
                                        </template>
                                        <div x-show="searchQuery.trim() !== '' && searchResults.length === 0" class="p-6 text-center text-sm text-flag-ink/40">
                                            لا توجد نتائج مطابقة
                                        </div>
                                        <div x-show="searchQuery.trim() === ''" class="p-6 text-center text-sm text-flag-ink/40">
                                            ابدأ الكتابة للبحث في المواد والفيديوهات
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center gap-4 flex-shrink-0">
                                <a href="dashboard.html" class="text-sm text-flag-ink/60 hover:text-flag-red transition-colors">
                                    <i class="fas fa-arrow-right"></i> <span class="hidden lg:inline">لوحة التحكم</span>
                                </a>
                                <span class="de-avatar h-9 w-9 text-xs" x-text="initials(user.full_name)"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div class="de-card-dark text-white rounded-2xl p-6 mb-8 relative overflow-hidden">
                    <div class="de-corner-mark top-4 end-4 rounded-tr-xl border-b-0 border-s-0 hidden sm:block"></div>
                    <div class="flex items-center gap-4">
                        <div class="h-12 w-12 bg-white/10 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-chalkboard text-flag-gold text-xl"></i>
                        </div>
                        <div>
                            <h2 class="font-display text-xl font-bold mb-1">مرحبًا بك في الفصل الدراسي</h2>
                            <p class="text-sm text-white/70">مواد تعليمية وفيديوهات يضيفها فريقنا لمساعدتك في التحضير</p>
                        </div>
                    </div>
                </div>

                <!-- PDF materials -->
                <div class="mb-10">
                    <h2 class="font-display text-lg font-bold text-flag-ink mb-4">
                        <i class="fas fa-file-pdf text-flag-red me-2"></i> المواد التعليمية
                    </h2>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="r in pdfResources" :key="r.id">
                            <div class="de-card rounded-2xl p-5">
                                <div class="h-11 w-11 rounded-xl bg-flag-red/10 flex items-center justify-center mb-4">
                                    <i class="fas fa-file-pdf text-flag-red"></i>
                                </div>
                                <span class="de-badge de-badge-red mb-2 inline-block" x-show="r.category" x-text="r.category"></span>
                                <h3 class="font-display font-semibold text-flag-ink mb-1" x-text="r.title"></h3>
                                <p class="text-sm text-flag-ink/60 mb-4" x-text="r.description"></p>
                                <button @click="openPdf(r)" class="de-btn de-btn-primary w-full text-sm py-2.5">
                                    <i class="fas fa-eye"></i> فتح المستند
                                </button>
                            </div>
                        </template>
                    </div>
                    <div x-show="!resourcesLoading && pdfResources.length === 0" class="de-card rounded-2xl p-8 text-center text-sm text-flag-ink/40">
                        لا توجد مواد تعليمية بعد — سيتم إضافتها قريبًا
                    </div>
                </div>

                <!-- YouTube videos -->
                <div>
                    <h2 class="font-display text-lg font-bold text-flag-ink mb-4">
                        <i class="fab fa-youtube text-flag-red me-2"></i> فيديوهات تعليمية
                    </h2>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="r in youtubeResources" :key="r.id">
                            <button @click="openVideo(r)" class="de-card rounded-2xl overflow-hidden text-start w-full">
                                <div class="relative aspect-video bg-flag-black">
                                    <img :src="'https://img.youtube.com/vi/' + r.youtube_id + '/hqdefault.jpg'" :alt="r.title" class="w-full h-full object-cover">
                                    <span class="absolute inset-0 bg-black/30 hover:bg-black/40 transition-colors flex items-center justify-center">
                                        <span class="h-14 w-14 rounded-full bg-flag-accent flex items-center justify-center text-white text-xl shadow-lg">
                                            <i class="fas fa-play ms-1"></i>
                                        </span>
                                    </span>
                                </div>
                                <div class="p-4">
                                    <span class="de-badge de-badge-red mb-2 inline-block" x-show="r.category" x-text="r.category"></span>
                                    <h3 class="font-display font-semibold text-flag-ink mb-1" x-text="r.title"></h3>
                                    <p class="text-sm text-flag-ink/60" x-text="r.description"></p>
                                </div>
                            </button>
                        </template>
                    </div>
                    <div x-show="!resourcesLoading && youtubeResources.length === 0" class="de-card rounded-2xl p-8 text-center text-sm text-flag-ink/40">
                        لا توجد فيديوهات بعد — سيتم إضافتها قريبًا
                    </div>
                </div>
            </main>
        </div>
    </template>

    <!-- ============ PDF viewer modal ============ -->
    <div x-show="viewingPdf" x-cloak x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-flag-black/70 backdrop-blur-sm p-4">
        <div class="de-card w-full max-w-4xl h-[90vh] overflow-hidden flex flex-col">
            <div class="de-flag-ribbon"></div>
            <div class="flex items-center justify-between px-6 py-4 border-b border-black/10 flex-shrink-0">
                <h3 class="font-display font-semibold text-flag-ink truncate" x-text="viewingPdf && viewingPdf.title"></h3>
                <button @click="closePdf()" class="text-flag-ink/40 hover:text-flag-red flex-shrink-0 ms-4"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 bg-flag-cream">
                <iframe x-show="viewingPdf" :src="viewingPdf && viewingPdf.url" class="w-full h-full" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- ============ Video lightbox (medium) ============ -->
    <!-- The iframe only exists in the DOM while a video is open (x-if,
         not x-show) so closing it actually stops playback/loading --
         and since this is the only video player on the page, at most
         one video can ever be loading at once. -->
    <div x-show="viewingVideo" x-cloak x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-flag-black/70 backdrop-blur-sm p-4">
        <div class="de-card w-full max-w-2xl overflow-hidden">
            <div class="de-flag-ribbon"></div>
            <div class="flex items-center justify-between px-5 py-3 border-b border-black/10">
                <h3 class="font-display font-semibold text-flag-ink text-sm truncate" x-text="viewingVideo && viewingVideo.title"></h3>
                <button @click="closeVideo()" class="text-flag-ink/40 hover:text-flag-red flex-shrink-0 ms-4"><i class="fas fa-times"></i></button>
            </div>
            <div class="aspect-video bg-flag-black">
                <template x-if="viewingVideo">
                    <iframe :src="'https://www.youtube.com/embed/' + viewingVideo.youtube_id + '?autoplay=1'"
                            class="w-full h-full" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen></iframe>
                </template>
            </div>
            <div class="p-4" x-show="viewingVideo && viewingVideo.description">
                <p class="text-sm text-flag-ink/60" x-text="viewingVideo && viewingVideo.description"></p>
            </div>
        </div>
    </div>

    <!-- ============ Toast ============ -->
    <div x-show="toast" x-cloak x-transition class="fixed bottom-6 inset-x-0 flex justify-center z-50 px-4">
        <div class="de-card px-5 py-3 rounded-xl flex items-center gap-2 text-sm shadow-xl">
            <i class="fas fa-circle-exclamation text-red-600"></i>
            <span x-text="toast"></span>
        </div>
    </div>

    <script>
        function classroomApp() {
            return {
                user: null,
                authChecked: false,
                gateStatus: 'loading',

                resources: [],
                resourcesLoading: false,
                viewingPdf: null,
                viewingVideo: null,
                searchOpen: false,
                toast: '',
                searchQuery: '',
                selectedCategory: 'all',
                selectedType: 'all',

                get pdfResources() {
                    return this.resources.filter(r => r.type === 'pdf');
                },
                get youtubeResources() {
                    return this.resources.filter(r => r.type === 'youtube');
                },
                get categories() {
                    const set = new Set(this.resources.map(r => r.category).filter(Boolean));
                    return Array.from(set).sort();
                },
                get searchResults() {
                    return this.resources
                        .filter(r => this.matchesSearch(r) && this.matchesCategory(r) && (this.selectedType === 'all' || r.type === this.selectedType))
                        .slice(0, 10);
                },

                matchesSearch(r) {
                    const q = this.searchQuery.trim().toLowerCase();
                    if (!q) return true;
                    return (r.title || '').toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q);
                },
                matchesCategory(r) {
                    return this.selectedCategory === 'all' || r.category === this.selectedCategory;
                },
                selectSearchResult(r) {
                    this.searchOpen = false;
                    if (r.type === 'pdf') this.openPdf(r);
                    else this.openVideo(r);
                },

                async init() {
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }
                    try {
                        const profile = await sbGetProfile(session.user.id);
                        if (profile.role === 'admin') {
                            window.location.href = 'admin.html';
                            return;
                        }
                        this.user = profile;
                        this.gateStatus = profile.membership_status === 'active' ? 'ok' : profile.membership_status;
                        this.authChecked = true;

                        if (this.gateStatus === 'ok') {
                            this.loadResources();
                        }
                    } catch (e) {
                        console.error(e);
                        this.authChecked = true;
                    }
                },

                async loadResources() {
                    this.resourcesLoading = true;
                    try {
                        const { data, error } = await sb.from('resources').select('*').order('created_at', { ascending: false });
                        if (!error) this.resources = data;
                    } catch (e) {
                        console.error(e);
                    } finally {
                        this.resourcesLoading = false;
                    }
                },

                async openPdf(resource) {
                    try {
                        const { data, error } = await sb.storage.from('resources').createSignedUrl(resource.file_path, 3600);
                        if (error || !data) {
                            this.showToast('تعذّر فتح المستند');
                            return;
                        }
                        this.viewingPdf = { title: resource.title, url: data.signedUrl };
                    } catch (e) {
                        console.error(e);
                        this.showToast('تعذّر فتح المستند');
                    }
                },

                closePdf() {
                    this.viewingPdf = null;
                },

                openVideo(resource) {
                    this.viewingVideo = resource;
                },

                closeVideo() {
                    this.viewingVideo = null;
                },

                showToast(msg) {
                    this.toast = msg;
                    setTimeout(() => { this.toast = ''; }, 2800);
                },

                initials(name) {
                    if (!name) return '?';
                    const parts = name.trim().split(/\s+/);
                    return parts.length > 1 ? parts[0].charAt(0) + parts[1].charAt(0) : parts[0].charAt(0);
                }
            };
        }
    </script>
</body>
</html>
