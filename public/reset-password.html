<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - LisanTest.com</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              flag: {
                black: '#0E2A4C', blacksoft: '#163B63', charcoal: '#1F4C78',
                red: '#2563EB', redbright: '#3B82F6', reddeep: '#1D4ED8',
                gold: '#38BDF8', goldsoft: '#7DD3FC',
                accent: '#FF7A45', accentbright: '#FF9466', accentdeep: '#E85A2A',
                cream: '#F5F8FC', paper: '#FFFFFF', ink: '#1E293B'
              }
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              arabic: ['Cairo', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none !important;}</style>
</head>
<body class="font-arabic de-dark-bg text-flag-ink antialiased min-h-screen flex items-center justify-center p-4" x-data="resetPasswordApp()" x-init="init()">

    <div class="de-card w-full max-w-md overflow-hidden text-center">
        <div class="de-flag-ribbon"></div>
        <div class="p-8">
            <span class="de-stamp de-stamp-onlight h-16 w-16 text-xs mx-auto mb-5"><i class="fas fa-key"></i></span>

            <!-- Waiting for Supabase to process the recovery link -->
            <template x-if="stage === 'checking'">
                <div>
                    <i class="fas fa-circle-notch fa-spin text-2xl text-flag-red mb-3"></i>
                    <p class="text-sm text-flag-ink/60">جارٍ التحقق من الرابط...</p>
                </div>
            </template>

            <!-- Invalid or expired link -->
            <template x-if="stage === 'invalid'">
                <div>
                    <h1 class="font-display text-xl font-bold text-flag-ink mb-3">الرابط غير صالح</h1>
                    <p class="text-sm text-flag-ink/60 leading-relaxed mb-6">
                        قد يكون رابط استعادة كلمة المرور منتهي الصلاحية أو تم استخدامه من قبل. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.
                    </p>
                    <a href="index.html" class="de-btn w-full text-sm py-3" style="background:#EEEAE0;color:#1E293B;">
                        <i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية
                    </a>
                </div>
            </template>

            <!-- Set new password -->
            <template x-if="stage === 'form'">
                <div>
                    <h1 class="font-display text-xl font-bold text-flag-ink mb-2">تعيين كلمة مرور جديدة</h1>
                    <p class="text-sm text-flag-ink/60 mb-6">أدخل كلمة المرور الجديدة لحسابك.</p>
                    <form @submit.prevent="updatePassword()" class="space-y-4 text-start">
                        <div>
                            <label class="block text-sm font-medium text-flag-ink/70 mb-2">كلمة المرور الجديدة</label>
                            <div class="relative">
                                <input :type="showPassword1 ? 'text' : 'password'" x-model="newPassword" required minlength="6"
                                       class="w-full px-4 py-2.5 pe-11 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/40 focus:border-flag-red">
                                <button type="button" @click="showPassword1 = !showPassword1" class="absolute top-1/2 -translate-y-1/2 end-3.5 text-flag-ink/40 hover:text-flag-red">
                                    <i class="fas" :class="showPassword1 ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-flag-ink/70 mb-2">تأكيد كلمة المرور</label>
                            <div class="relative">
                                <input :type="showPassword2 ? 'text' : 'password'" x-model="confirmPassword" required minlength="6"
                                       class="w-full px-4 py-2.5 pe-11 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/40 focus:border-flag-red">
                                <button type="button" @click="showPassword2 = !showPassword2" class="absolute top-1/2 -translate-y-1/2 end-3.5 text-flag-ink/40 hover:text-flag-red">
                                    <i class="fas" :class="showPassword2 ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                            </div>
                        </div>
                        <p x-show="formError" x-cloak class="text-sm text-red-600" x-text="formError"></p>
                        <button type="submit" :disabled="saving" class="de-btn de-btn-primary w-full text-sm py-3 disabled:opacity-50"
                                x-text="saving ? 'جارٍ الحفظ...' : 'حفظ كلمة المرور'"></button>
                    </form>
                </div>
            </template>

            <!-- Done -->
            <template x-if="stage === 'done'">
                <div>
                    <i class="fas fa-circle-check text-emerald-600 text-3xl mb-3"></i>
                    <h1 class="font-display text-xl font-bold text-flag-ink mb-3">تم تحديث كلمة المرور</h1>
                    <p class="text-sm text-flag-ink/60 leading-relaxed mb-6">يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.</p>
                    <a href="index.html" class="de-btn de-btn-primary w-full text-sm py-3">
                        <i class="fas fa-sign-in-alt"></i> الذهاب لتسجيل الدخول
                    </a>
                </div>
            </template>
        </div>
    </div>

    <script>
        function resetPasswordApp() {
            return {
                stage: 'checking', // checking | invalid | form | done
                newPassword: '',
                confirmPassword: '',
                showPassword1: false,
                showPassword2: false,
                formError: '',
                saving: false,

                init() {
                    // Supabase parses the recovery token from the URL on load and
                    // fires this event once a temporary recovery session is ready.
                    sb.auth.onAuthStateChange((event) => {
                        if (event === 'PASSWORD_RECOVERY') {
                            this.stage = 'form';
                        }
                    });
                    // If the event already fired before this listener was attached
                    // (race on fast loads), fall back to checking for a session.
                    setTimeout(async () => {
                        if (this.stage === 'checking') {
                            const { data: { session } } = await sb.auth.getSession();
                            this.stage = session ? 'form' : 'invalid';
                        }
                    }, 2500);
                },

                async updatePassword() {
                    this.formError = '';
                    if (this.newPassword.length < 6) {
                        this.formError = 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل';
                        return;
                    }
                    if (this.newPassword !== this.confirmPassword) {
                        this.formError = 'كلمتا المرور غير متطابقتين';
                        return;
                    }
                    this.saving = true;
                    try {
                        const { error } = await sb.auth.updateUser({ password: this.newPassword });
                        if (error) {
                            this.formError = 'تعذّر تحديث كلمة المرور. حاول مرة أخرى.';
                            return;
                        }
                        this.stage = 'done';
                    } catch (e) {
                        console.error(e);
                        this.formError = 'حدث خطأ أثناء الاتصال بالخادم';
                    } finally {
                        this.saving = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
