<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - LisanTest.com</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              flag: {
                black: '#0E2A4C', blacksoft: '#163B63', charcoal: '#1F4C78',
                red: '#2563EB', redbright: '#3B82F6', reddeep: '#1D4ED8',
                gold: '#38BDF8', goldsoft: '#7DD3FC',
                accent: '#FF7A45', accentbright: '#FF9466', accentdeep: '#E85A2A',
                cream: '#F5F8FC', paper: '#FFFFFF', ink: '#1E293B'
              }
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              arabic: ['Cairo', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Supabase client (must load before Alpine, since x-init calls into it) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none !important;}</style>
</head>
<body class="font-arabic de-paper-bg text-flag-ink antialiased min-h-screen" x-data="adminApp()" x-init="init()">

    <!-- ============ LOGIN GATE ============ -->
    <template x-if="authChecked && !admin">
        <div class="min-h-screen de-dark-bg flex items-center justify-center p-4">
            <div class="de-card w-full max-w-sm overflow-hidden">
                <div class="de-flag-ribbon"></div>
                <div class="p-8 text-center">
                    <span class="de-stamp h-16 w-16 text-xs mx-auto mb-5"><i class="fas fa-user-shield"></i></span>
                    <h1 class="font-display text-xl font-bold text-flag-ink mb-1">لوحة تحكم المشرف</h1>
                    <p class="text-sm text-flag-ink/50 mb-6">سجّل الدخول بحساب مشرف للمتابعة</p>

                    <form @submit.prevent="login()" class="space-y-4 text-start">
                        <div>
                            <label class="block text-sm font-medium text-flag-ink/70 mb-2">البريد الإلكتروني</label>
                            <input type="email" x-model="loginEmail" required
                                   class="w-full px-4 py-2.5 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/40 focus:border-flag-red">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-flag-ink/70 mb-2">كلمة المرور</label>
                            <div class="relative">
                                <input :type="showLoginPassword ? 'text' : 'password'" x-model="loginPassword" required
                                       class="w-full px-4 py-2.5 pe-11 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/40 focus:border-flag-red">
                                <button type="button" @click="showLoginPassword = !showLoginPassword" class="absolute top-1/2 -translate-y-1/2 end-3.5 text-flag-ink/40 hover:text-flag-red">
                                    <i class="fas" :class="showLoginPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                            </div>
                        </div>
                        <p x-show="loginError" x-cloak class="text-sm text-flag-red" x-text="loginError"></p>
                        <button type="submit" :disabled="isLoggingIn" class="de-btn de-btn-primary w-full text-sm py-3 disabled:opacity-50">
                            <span x-text="isLoggingIn ? 'جاري الدخول...' : 'دخول'"></span>
                        </button>
                    </form>

                    <p class="mt-6 text-xs text-flag-ink/40 font-mono leading-relaxed">
                        بيانات تجريبية للاختبار:<br>
                        admin@ausbildung-test-prep.com / Admin@2024
                    </p>
                    <a href="index.html" class="block mt-4 text-xs text-flag-ink/50 hover:text-flag-red">→ العودة إلى الموقع</a>
                </div>
            </div>
        </div>
    </template>

    <!-- ============ DASHBOARD ============ -->
    <template x-if="authChecked && admin">
        <div>
            <!-- Top bar -->
            <header class="de-light-bg text-flag-ink shadow-sm border-b border-black/5 sticky top-0 z-30">
                <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="de-stamp de-stamp-onlight h-10 w-10 text-xs"><i class="fas fa-user-shield"></i></span>
                        <div class="hidden sm:block">
                            <div class="font-display font-semibold text-sm leading-tight">لوحة تحكم المشرف</div>
                            <div class="text-xs text-flag-ink/50">LisanTest.com</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm text-flag-ink/70 hidden sm:inline" x-text="admin.full_name"></span>
                        <a href="index.html" class="text-flag-ink/50 hover:text-flag-red transition-colors text-sm" title="العودة إلى الموقع">
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </a>
                        <button @click="logout()" class="text-flag-ink/50 hover:text-flag-red transition-colors text-sm" title="تسجيل الخروج">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <!-- Tabs -->
                <div class="flex gap-2 mb-8 overflow-x-auto pb-1">
                    <button @click="activeTab = 'overview'"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
                            :class="activeTab === 'overview' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-gauge-high me-1"></i> نظرة عامة
                    </button>
                    <button @click="activeTab = 'members'"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors relative"
                            :class="activeTab === 'members' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-users me-1"></i> الأعضاء
                        <span x-show="stats.pending > 0" x-cloak
                              class="absolute -top-1.5 -end-1.5 h-5 min-w-[1.25rem] px-1 rounded-full bg-flag-gold text-white text-[10px] font-bold font-mono flex items-center justify-center"
                              x-text="stats.pending"></span>
                    </button>
                    <button @click="activeTab = 'notifications'"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
                            :class="activeTab === 'notifications' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-bell me-1"></i> الإشعارات
                    </button>
                    <button @click="activeTab = 'resources'; loadResources()"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
                            :class="activeTab === 'resources' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-chalkboard me-1"></i> الفصل الدراسي
                    </button>
                    <button @click="activeTab = 'tests'; loadTests()"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
                            :class="activeTab === 'tests' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-file-circle-plus me-1"></i> الاختبارات
                    </button>
                    <button @click="activeTab = 'support'; loadThreads()"
                            class="px-5 py-2.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors relative"
                            :class="activeTab === 'support' ? 'bg-flag-black text-white' : 'bg-white text-flag-ink/60 border border-black/10 hover:border-flag-red/40'">
                        <i class="fas fa-headset me-1"></i> الدعم
                        <span x-show="totalUnread > 0" x-cloak
                              class="absolute -top-1.5 -end-1.5 h-5 min-w-[1.25rem] px-1 rounded-full bg-red-600 text-white text-[10px] font-bold font-mono flex items-center justify-center"
                              x-text="totalUnread"></span>
                    </button>
                </div>

                <!-- ===== Overview tab ===== -->
                <div x-show="activeTab === 'overview'" x-cloak>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-10">
                        <div class="de-card rounded-2xl p-5">
                            <div class="h-10 w-10 rounded-lg bg-flag-black/5 flex items-center justify-center mb-3">
                                <i class="fas fa-users text-flag-ink/60"></i>
                            </div>
                            <div class="text-2xl font-display font-bold text-flag-ink" x-text="stats.total"></div>
                            <div class="text-xs text-flag-ink/50">إجمالي الأعضاء</div>
                        </div>
                        <div class="de-card rounded-2xl p-5 border-flag-gold/40">
                            <div class="h-10 w-10 rounded-lg bg-flag-gold/15 flex items-center justify-center mb-3">
                                <i class="fas fa-hourglass-half text-flag-gold"></i>
                            </div>
                            <div class="text-2xl font-display font-bold text-flag-ink" x-text="stats.pending"></div>
                            <div class="text-xs text-flag-ink/50">قيد المراجعة</div>
                        </div>
                        <div class="de-card rounded-2xl p-5">
                            <div class="h-10 w-10 rounded-lg bg-emerald-100 flex items-center justify-center mb-3">
                                <i class="fas fa-circle-check text-emerald-600"></i>
                            </div>
                            <div class="text-2xl font-display font-bold text-flag-ink" x-text="stats.active"></div>
                            <div class="text-xs text-flag-ink/50">أعضاء نشطون</div>
                        </div>
                        <div class="de-card rounded-2xl p-5">
                            <div class="h-10 w-10 rounded-lg bg-red-50 flex items-center justify-center mb-3">
                                <i class="fas fa-circle-xmark text-red-600"></i>
                            </div>
                            <div class="text-2xl font-display font-bold text-flag-ink" x-text="stats.rejected"></div>
                            <div class="text-xs text-flag-ink/50">مرفوضون</div>
                        </div>
                        <div class="de-card rounded-2xl p-5">
                            <div class="h-10 w-10 rounded-lg bg-flag-black/5 flex items-center justify-center mb-3">
                                <i class="fas fa-credit-card text-flag-ink/60"></i>
                            </div>
                            <div class="text-2xl font-display font-bold text-flag-ink" x-text="stats.activeSubscriptions"></div>
                            <div class="text-xs text-flag-ink/50">اشتراكات فعالة</div>
                        </div>
                    </div>

                    <div class="de-card rounded-2xl overflow-hidden">
                        <div class="p-6 border-b border-black/5 flex items-center justify-between">
                            <h2 class="font-display font-semibold text-flag-ink">
                                <i class="fas fa-hourglass-half text-flag-gold me-2"></i> بانتظار المراجعة
                            </h2>
                            <button @click="activeTab = 'members'; memberFilter = 'pending'" class="text-sm text-flag-red hover:text-flag-reddeep">
                                عرض الكل <i class="fas fa-arrow-left"></i>
                            </button>
                        </div>
                        <div class="divide-y divide-black/5">
                            <template x-for="m in members.filter(x => x.membership_status === 'pending').slice(0,5)" :key="m.id">
                                <div class="p-4 sm:p-5 flex items-center justify-between gap-4 flex-wrap">
                                    <div class="flex items-center gap-3 min-w-0">
                                        <span class="de-avatar h-10 w-10 text-xs flex-shrink-0" x-text="initials(m.full_name)"></span>
                                        <div class="min-w-0">
                                            <div class="font-medium text-flag-ink truncate" x-text="m.full_name"></div>
                                            <div class="text-xs text-flag-ink/50 truncate" x-text="m.email"></div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 flex-shrink-0">
                                        <button @click="approve(m.id)" class="de-btn de-btn-primary text-xs py-2 px-4">
                                            <i class="fas fa-check"></i> موافقة
                                        </button>
                                        <button @click="reject(m.id)" class="de-btn text-xs py-2 px-4" style="background:#EEEAE0;color:#1E293B;">
                                            <i class="fas fa-xmark"></i> رفض
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="members.filter(x => x.membership_status === 'pending').length === 0" class="p-8 text-center text-sm text-flag-ink/40">
                                لا يوجد أعضاء بانتظار المراجعة حاليًا
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== Members tab ===== -->
                <div x-show="activeTab === 'members'" x-cloak>
                    <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between mb-6">
                        <div class="flex gap-2 overflow-x-auto pb-1">
                            <template x-for="f in [['all','الكل'],['pending','قيد المراجعة'],['active','نشط'],['rejected','مرفوض']]" :key="f[0]">
                                <button @click="memberFilter = f[0]; loadMembers()"
                                        class="px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap transition-colors"
                                        :class="memberFilter === f[0] ? 'bg-flag-red text-white' : 'bg-white text-flag-ink/60 border border-black/10'"
                                        x-text="f[1]"></button>
                            </template>
                        </div>
                        <div class="relative">
                            <i class="fas fa-search absolute top-1/2 -translate-y-1/2 start-3 text-flag-ink/30 text-sm"></i>
                            <input type="text" x-model.debounce.400ms="memberSearch" @input="loadMembers()"
                                   placeholder="بحث بالاسم أو البريد..."
                                   class="ps-9 pe-4 py-2.5 rounded-lg border border-black/10 text-sm focus:outline-none focus:ring-2 focus:ring-flag-red/30 w-full sm:w-64">
                        </div>
                    </div>

                    <div class="de-card rounded-2xl overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="bg-flag-cream text-flag-ink/50 text-xs">
                                        <th class="text-start px-5 py-3 font-medium">العضو</th>
                                        <th class="text-start px-5 py-3 font-medium hidden md:table-cell">تاريخ التسجيل</th>
                                        <th class="text-start px-5 py-3 font-medium">الحالة</th>
                                        <th class="text-start px-5 py-3 font-medium hidden lg:table-cell">الاشتراك</th>
                                        <th class="text-start px-5 py-3 font-medium">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-black/5">
                                    <template x-for="m in members" :key="m.id">
                                        <tr class="hover:bg-flag-cream/60 transition-colors">
                                            <td class="px-5 py-4">
                                                <div class="flex items-center gap-3">
                                                    <span class="de-avatar h-9 w-9 text-xs flex-shrink-0" x-text="initials(m.full_name)"></span>
                                                    <div class="min-w-0">
                                                        <div class="font-medium text-flag-ink truncate" x-text="m.full_name"></div>
                                                        <div class="text-xs text-flag-ink/50 truncate" x-text="m.email"></div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-5 py-4 text-flag-ink/60 text-xs font-mono hidden md:table-cell" x-text="formatDate(m.created_at)"></td>
                                            <td class="px-5 py-4">
                                                <span class="de-badge" :class="statusBadgeClass(m.membership_status)" x-text="statusLabel(m.membership_status)"></span>
                                            </td>
                                            <td class="px-5 py-4 text-xs text-flag-ink/60 hidden lg:table-cell">
                                                <template x-if="m.subscription">
                                                    <span>ينتهي <span x-text="formatDate(m.subscription.current_period_end)"></span></span>
                                                </template>
                                                <template x-if="!m.subscription">
                                                    <span class="text-flag-ink/30">لا يوجد</span>
                                                </template>
                                            </td>
                                            <td class="px-5 py-4">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <button x-show="m.membership_status !== 'active'" @click="approve(m.id)"
                                                            class="h-8 w-8 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 transition-colors" title="موافقة">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                    <button x-show="m.membership_status !== 'rejected'" @click="reject(m.id)"
                                                            class="h-8 w-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors" title="رفض">
                                                        <i class="fas fa-xmark"></i>
                                                    </button>
                                                    <button x-show="m.membership_status !== 'pending'" @click="resetMember(m.id)"
                                                            class="h-8 w-8 rounded-lg bg-flag-black/5 text-flag-ink/60 hover:bg-flag-black/10 transition-colors" title="إعادة إلى قيد المراجعة">
                                                        <i class="fas fa-rotate-left"></i>
                                                    </button>
                                                    <button @click="confirmDelete(m)"
                                                            class="h-8 w-8 rounded-lg bg-flag-black/5 text-flag-ink/40 hover:bg-red-50 hover:text-red-600 transition-colors" title="حذف">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div x-show="!membersLoading && members.length === 0" class="p-10 text-center text-sm text-flag-ink/40">
                                لا يوجد أعضاء مطابقون
                            </div>
                            <div x-show="membersLoading" x-cloak class="p-10 text-center text-sm text-flag-ink/40">
                                <i class="fas fa-circle-notch fa-spin"></i> جاري التحميل...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== Notifications tab ===== -->
                <div x-show="activeTab === 'notifications'" x-cloak class="grid lg:grid-cols-5 gap-6">
                    <div class="lg:col-span-2 de-card rounded-2xl p-6 h-fit">
                        <h2 class="font-display font-semibold text-flag-ink mb-5">
                            <i class="fas fa-paper-plane text-flag-red me-2"></i> إرسال إشعار جديد
                        </h2>
                        <form @submit.prevent="sendNotification()" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-flag-ink/70 mb-2">العنوان</label>
                                <input type="text" x-model="notifyTitle" required
                                       class="w-full px-4 py-2.5 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/30">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-flag-ink/70 mb-2">الرسالة</label>
                                <textarea x-model="notifyMessage" required rows="4"
                                          class="w-full px-4 py-2.5 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/30 resize-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-flag-ink/70 mb-2">الجمهور المستهدف</label>
                                <select x-model="notifyAudience"
                                        class="w-full px-4 py-2.5 border border-black/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-flag-red/30 bg-white">
                                    <option value="all">جميع الأعضاء</option>
                                    <option value="active">الأعضاء النشطون فقط</option>
                                    <option value="pending">قيد المراجعة فقط</option>
                                    <option value="rejected">المرفوضون فقط</option>
                                </select>
                            </div>
                            <button type="submit" :disabled="sending" class="de-btn de-btn-primary w-full text-sm py-3 disabled:opacity-50">
                                <span x-text="sending ? 'جاري الإرسال...' : 'إرسال الإشعار'"></span>
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-3 de-card rounded-2xl overflow-hidden">
                        <div class="p-6 border-b border-black/5">
                            <h2 class="font-display font-semibold text-flag-ink">سجل الإشعارات المرسلة</h2>
                        </div>
                        <div class="divide-y divide-black/5 max-h-[560px] overflow-y-auto">
                            <template x-for="n in notifications" :key="n.id">
                                <div class="p-5">
                                    <div class="flex items-start justify-between gap-3 mb-1">
                                        <h3 class="font-medium text-flag-ink" x-text="n.title"></h3>
                                        <span class="text-xs text-flag-ink/40 font-mono whitespace-nowrap" x-text="formatDate(n.sent_at)"></span>
                                    </div>
                                    <p class="text-sm text-flag-ink/60 mb-2" x-text="n.message"></p>
                                    <div class="flex items-center gap-3 text-xs text-flag-ink/40">
                                        <span><i class="fas fa-users"></i> <span x-text="n.recipient_count"></span> مستلم</span>
                                        <span><i class="fas fa-bullseye"></i> <span x-text="audienceLabel(n.audience)"></span></span>
                                    </div>
                                </div>
                            </template>
                            <div x-show="notifications.length === 0" class="p-10 text-center text-sm text-flag-ink/40">
                                لم يتم إرسال أي إشعارات بعد
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== Resources / Classroom tab ===== -->
                <div x-show="activeTab === 'resources'" x-cloak class="grid lg:grid-cols-5 gap-6">
                    <div class="lg:col-span-2 de-card rounded-2xl p-6 h-fit">
                        <h2 class="font-display font-semibold text-flag-ink mb-5">
                            <i class="fas fa-upload text-flag-red me-2"></i> إضافة مادة جديدة
                        </h2>
                        <form @submit.prevent="uploadResource()" class="space-y-4">
                            <div class="flex gap-2">
                                <button type="button" @click="resourceType = 'pdf'"
                                        class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border transition-colors"
                                        :class="resourceType === 'pdf' ? 'bg-flag-black text-white border-flag-black' : 'border-black/15 text-flag-ink/60'">
                                    <i class="fas fa-file-pdf"></i> ملف PDF
                                </button>
                                <button type="button" @click="resourceType = 'youtube'"

                                           class="flex-1 px-3 py-2 border border-black/15 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-flag-red/30">
                                    <button type="submit" :disabled="adminSending || !adminNewMessage.trim()" class="h-9 w-9 rounded-full de-btn-primary flex items-center justify-center flex-shrink-0 disabled:opacity-50">
                                        <i class="fas fa-paper-plane text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </template>
                        <div x-show="!activeThread" class="flex-1 flex items-center justify-center text-sm text-flag-ink/40">
                            اختر محادثة لعرضها
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ============ Delete confirmation modal ============ -->
    <div x-show="deleteTarget" x-cloak x-transition
         class="fixed inset-0 z-50 flex items-center justify-center bg-flag-black/60 backdrop-blur-sm p-4">
        <div class="de-card w-full max-w-sm overflow-hidden" @click.outside="deleteTarget = null">
            <div class="de-flag-ribbon"></div>
            <div class="p-6 text-center">
                <div class="h-12 w-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-trash"></i>
                </div>
                <h3 class="font-display font-semibold text-flag-ink mb-2">حذف العضو نهائيًا؟</h3>
                <p class="text-sm text-flag-ink/60 mb-6">
                    سيتم حذف <span class="font-medium" x-text="deleteTarget && deleteTarget.full_name"></span> وكل بياناته نهائيًا. لا يمكن التراجع عن هذا الإجراء.
                </p>
                <div class="flex gap-3">
                    <button @click="deleteTarget = null" class="de-btn flex-1 text-sm py-2.5" style="background:#EEEAE0;color:#1E293B;">إلغاء</button>
                    <button @click="removeMember()" class="de-btn de-btn-primary flex-1 text-sm py-2.5">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ Resource delete confirmation modal ============ -->
    <div x-show="deleteResourceTarget" x-cloak x-transition
         class="fixed inset-0 z-50 flex items-center justify-center bg-flag-black/60 backdrop-blur-sm p-4">
        <div class="de-card w-full max-w-sm overflow-hidden" @click.outside="deleteResourceTarget = null">
            <div class="de-flag-ribbon"></div>
            <div class="p-6 text-center">
                <div class="h-12 w-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-trash"></i>
                </div>
                <h3 class="font-display font-semibold text-flag-ink mb-2">حذف المادة؟</h3>
                <p class="text-sm text-flag-ink/60 mb-6">
                    سيتم حذف <span class="font-medium" x-text="deleteResourceTarget && deleteResourceTarget.title"></span> نهائيًا من الفصل الدراسي. لا يمكن التراجع عن هذا الإجراء.
                </p>
                <div class="flex gap-3">
                    <button @click="deleteResourceTarget = null" class="de-btn flex-1 text-sm py-2.5" style="background:#EEEAE0;color:#1E293B;">إلغاء</button>
                    <button @click="deleteResource()" class="de-btn de-btn-primary flex-1 text-sm py-2.5">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ Test delete confirmation modal ============ -->
    <div x-show="deleteTestTarget" x-cloak x-transition
         class="fixed inset-0 z-50 flex items-center justify-center bg-flag-black/60 backdrop-blur-sm p-4">
        <div class="de-card w-full max-w-sm overflow-hidden" @click.outside="deleteTestTarget = null">
            <div class="de-flag-ribbon"></div>
            <div class="p-6 text-center">
                <div class="h-12 w-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-trash"></i>
                </div>
                <h3 class="font-display font-semibold text-flag-ink mb-2">حذف الاختبار؟</h3>
                <p class="text-sm text-flag-ink/60 mb-6">
                    سيتم حذف <span class="font-medium" x-text="deleteTestTarget && deleteTestTarget.title"></span> نهائيًا مع كل أسئلته ومحاولات الطلاب المرتبطة به. لا يمكن التراجع عن هذا الإجراء.
                </p>
                <div class="flex gap-3">
                    <button @click="deleteTestTarget = null" class="de-btn flex-1 text-sm py-2.5" style="background:#EEEAE0;color:#1E293B;">إلغاء</button>
                    <button @click="deleteTest()" class="de-btn de-btn-primary flex-1 text-sm py-2.5">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ Toast ============ -->
    <div x-show="toast" x-cloak x-transition
         class="fixed bottom-6 inset-x-0 flex justify-center z-50 px-4">
        <div class="de-card px-5 py-3 rounded-xl flex items-center gap-2 text-sm shadow-xl">
            <i class="fas fa-circle-check text-emerald-600"></i>
            <span x-text="toast"></span>
        </div>
    </div>

    <script>
        function adminApp() {
            return {
                admin: null,
                authChecked: false,

                loginEmail: '', loginPassword: '', loginError: '', isLoggingIn: false, showLoginPassword: false,

                activeTab: 'overview',
                stats: { total: 0, pending: 0, active: 0, rejected: 0, activeSubscriptions: 0 },

                members: [], memberFilter: 'all', memberSearch: '', membersLoading: false,
                notifications: [], notifyTitle: '', notifyMessage: '', notifyAudience: 'all', sending: false,

                resources: [], resourcesLoading: false, deleteResourceTarget: null,

                tests: [], testsLoading: false, testBuilderOpen: false, savingTest: false,
                testBuilderError: '', deleteTestTarget: null, testKeyCounter: 0,
                testBuilder: { id: null, title: '', description: '', test_type: '', level: 'B1', duration_minutes: 30, passing_score: 60, is_active: true, is_skill_practice: false, skill: '', sections: [], writing: { enabled: false, name: '', prompt: '', sample_answer: '' } },

                threads: [], threadsLoading: false, activeThread: null, threadMessages: [],
                adminNewMessage: '', adminSending: false, totalUnread: 0, supportChannel: null,
                resourceType: 'pdf', resourceTitle: '', resourceDescription: '', resourceCategory: '', resourceSkill: '',
                resourceFile: null, resourceYoutubeUrl: '', uploading: false, uploadError: '',

                deleteTarget: null,
                toast: '',

                async init() {
                    const { data: { session } } = await sb.auth.getSession();
                    if (session) {
                        try {
                            const profile = await sbGetProfile(session.user.id);
                            if (profile.role === 'admin') {
                                this.admin = profile;
                                this.loadAll();
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }
                    this.authChecked = true;
                },

                async login() {
                    this.isLoggingIn = true;
                    this.loginError = '';
                    try {
                        const { data, error } = await sb.auth.signInWithPassword({
                            email: this.loginEmail, password: this.loginPassword
                        });
                        if (error) {
                            this.loginError = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                            return;
                        }
                        const profile = await sbGetProfile(data.user.id);
                        if (profile.role !== 'admin') {
                            await sb.auth.signOut();
                            this.loginError = 'هذا الحساب ليس حساب مشرف';
                            return;
                        }
                        this.admin = profile;
                        this.loadAll();
                    } catch (e) {
                        this.loginError = 'حدث خطأ أثناء الاتصال بالخادم';
                    } finally {
                        this.isLoggingIn = false;
                    }
                },

                async logout() {
                    await sb.auth.signOut();
                    this.admin = null;
                },

                loadAll() {
                    this.loadStats();
                    this.loadMembers();
                    this.loadNotifications();
                },

                async loadStats() {
                    try {
                        const data = await sbInvoke('admin-members', { action: 'stats' });
                        if (data.success) this.stats = data.stats;
                    } catch (e) { console.error(e); }
                },

                async loadMembers() {
                    this.membersLoading = true;
                    try {
                        const data = await sbInvoke('admin-members', {
                            action: 'list', status: this.memberFilter, q: this.memberSearch || undefined
                        });
                        if (data.success) {
                            this.members = data.members.map(m => ({
                                ...m,
                                subscription: Array.isArray(m.subscriptions) ? (m.subscriptions[0] || null) : (m.subscriptions || null)
                            }));
                        }
                    } catch (e) { console.error(e); }
                    finally { this.membersLoading = false; }
                },

                async loadNotifications() {
                    try {
                        const data = await sbInvoke('admin-notifications', { action: 'list' });
                        if (data.success) this.notifications = data.notifications;
                    } catch (e) { console.error(e); }
                },

                async approve(id) {
                    await sbInvoke('admin-members', { action: 'approve', member_id: id });
                    this.showToast('تمت الموافقة على العضو');
                    this.loadStats(); this.loadMembers();
                },

                async reject(id) {
                    await sbInvoke('admin-members', { action: 'reject', member_id: id });
                    this.showToast('تم رفض العضو');
                    this.loadStats(); this.loadMembers();
                },

                async resetMember(id) {
                    await sbInvoke('admin-members', { action: 'reset', member_id: id });
                    this.showToast('تمت إعادة العضو إلى قيد المراجعة');
                    this.loadStats(); this.loadMembers();
                },

                confirmDelete(member) {
                    this.deleteTarget = member;
                },

                async removeMember() {
                    if (!this.deleteTarget) return;
                    await sbInvoke('admin-members', { action: 'delete', member_id: this.deleteTarget.id });
                    this.showToast('تم حذف العضو');
                    this.deleteTarget = null;
                    this.loadStats(); this.loadMembers();
                },

                async sendNotification() {
                    this.sending = true;
                    try {
                        const data = await sbInvoke('admin-notifications', {
                            action: 'send', title: this.notifyTitle, message: this.notifyMessage, audience: this.notifyAudience
                        });
                        if (data.success) {
                            this.notifyTitle = '';
                            this.notifyMessage = '';
                            this.showToast('تم إرسال الإشعار');
                            this.loadNotifications();
                        }
                    } catch (e) { console.error(e); }
                    finally { this.sending = false; }
                },

                async loadResources() {
                    this.resourcesLoading = true;
                    try {
                        const { data, error } = await sb.from('resources').select('*').order('created_at', { ascending: false });
                        if (!error) this.resources = data;
                    } catch (e) { console.error(e); }
                    finally { this.resourcesLoading = false; }
                },

                extractYoutubeId(url) {
                    const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
                    return match ? match[1] : null;
                },

                async uploadResource() {
                    this.uploadError = '';
                    if (!this.resourceTitle.trim()) {
                        this.uploadError = 'العنوان مطلوب';
                        return;
                    }

                    this.uploading = true;
                    try {
                        const row = {
                            title: this.resourceTitle.trim(),
                            description: this.resourceDescription.trim() || null,
                            category: this.resourceCategory.trim() || null,
                            skill: this.resourceSkill || null,
                            type: this.resourceType,
                            uploaded_by: this.admin.id
                        };

                        if (this.resourceType === 'pdf') {
                            if (!this.resourceFile) {
                                this.uploadError = 'يرجى اختيار ملف PDF';
                                this.uploading = false;
                                return;
                            }
                            const safeName = this.resourceFile.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
                            const path = `${crypto.randomUUID()}-${safeName}`;
                            const { error: upErr } = await sb.storage.from('resources').upload(path, this.resourceFile);
                            if (upErr) throw upErr;
                            row.file_path = path;
                        } else {
                            const videoId = this.extractYoutubeId(this.resourceYoutubeUrl.trim());
                            if (!videoId) {
                                this.uploadError = 'رابط يوتيوب غير صالح';
                                this.uploading = false;
                                return;
                            }
                            row.youtube_id = videoId;
                        }

                        const { error: insErr } = await sb.from('resources').insert(row);
                        if (insErr) throw insErr;

                        this.resourceTitle = '';
                        this.resourceDescription = '';
                        this.resourceCategory = '';
                        this.resourceSkill = '';
                        this.resourceFile = null;
                        this.resourceYoutubeUrl = '';
                        this.showToast('تمت إضافة المادة بنجاح');
                        this.loadResources();
                    } catch (e) {
                        console.error(e);
                        this.uploadError = 'حدث خطأ أثناء الرفع';
                    } finally {
                        this.uploading = false;
                    }
                },

                confirmDeleteResource(resource) {
                    this.deleteResourceTarget = resource;
                },

                async deleteResource() {
                    const r = this.deleteResourceTarget;
                    if (!r) return;
                    try {
                        if (r.type === 'pdf' && r.file_path) {
                            await sb.storage.from('resources').remove([r.file_path]);
                        }
                        await sb.from('resources').delete().eq('id', r.id);
                        this.showToast('تم حذف المادة');
                        this.deleteResourceTarget = null;
                        this.loadResources();
                    } catch (e) {
                        console.error(e);
                        this.showToast('تعذّر حذف المادة');
                    }
                },

                async loadThreads() {
                    this.threadsLoading = true;
                    try {
                        const { data, error } = await sb.from('support_threads').select('*').order('last_message_at', { ascending: false });
                        if (!error) {
                            this.threads = data;
                            this.totalUnread = data.reduce((sum, t) => sum + (t.unread_count || 0), 0);
                        }
                    } catch (e) { console.error(e); }
                    finally { this.threadsLoading = false; }

                    if (!this.supportChannel) this.subscribeSupportRealtime();
                },

                subscribeSupportRealtime() {
                    this.supportChannel = sb
                        .channel('admin-support')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages' }, (payload) => {
                            if (this.activeThread && payload.new.student_id === this.activeThread.student_id) {
                                this.threadMessages.push(payload.new);
                                this.$nextTick(() => {
                                    const el = this.$refs.adminChatScroll;
                                    if (el) el.scrollTop = el.scrollHeight;
                                });
                                if (payload.new.sender_role === 'student') this.markThreadRead(this.activeThread.student_id);
                            }
                            this.loadThreads();
                        })
                        .subscribe();
                },

                async openThread(t) {
                    this.activeThread = t;
                    const { data, error } = await sb.from('support_messages').select('*')
                        .eq('student_id', t.student_id).order('created_at', { ascending: true });
                    if (!error) this.threadMessages = data;
                    this.$nextTick(() => {
                        const el = this.$refs.adminChatScroll;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                    if (t.unread_count > 0) await this.markThreadRead(t.student_id);
                },

                async markThreadRead(studentId) {
                    const t = this.threads.find(x => x.student_id === studentId);
                    if (t) { this.totalUnread -= (t.unread_count || 0); t.unread_count = 0; }
                    await sb.from('support_messages')
                        .update({ read_at: new Date().toISOString() })
                        .eq('student_id', studentId).eq('sender_role', 'student').is('read_at', null);
                },

                async sendAdminMessage() {
                    const body = this.adminNewMessage.trim();
                    if (!body || this.adminSending || !this.activeThread) return;
                    this.adminSending = true;
                    this.adminNewMessage = '';
                    try {
                        const { error } = await sb.from('support_messages').insert({
                            student_id: this.activeThread.student_id, sender_id: this.admin.id,
                            sender_role: 'admin', body
                        });
                        if (error) this.adminNewMessage = body;
                    } finally {
                        this.adminSending = false;
                    }
                },

                formatTime(iso) {
                    return new Date(iso).toLocaleTimeString('ar-MA', { hour: '2-digit', minute: '2-digit' });
                },

                async loadTests() {
                    this.testsLoading = true;
                    try {
                        const data = await sbInvoke('admin-tests', { action: 'list' });
                        if (data.success) this.tests = data.tests;
                    } catch (e) { console.error(e); }
                    finally { this.testsLoading = false; }
                },

                blankQuestion() {
                    this.testKeyCounter++;
                    return {
                        _key: 'q' + this.testKeyCounter, question_text: '', explanation: '', points: 1,
                        answers: [
                            { _key: 'a' + (++this.testKeyCounter), answer_text: '', is_correct: true },
                            { _key: 'a' + (++this.testKeyCounter), answer_text: '', is_correct: false }
                        ]
                    };
                },

                blankSection() {
                    this.testKeyCounter++;
                    return {
                        _key: 's' + this.testKeyCounter, key: '', name: '', type: 'reading',
                        official_duration_minutes: null, instructions: '', passage: '', audio_url: null,
                        audioUploading: false, questions: [this.blankQuestion()]
                    };
                },

                newTest() {
                    this.testBuilder = {
                        id: null, title: '', description: '', test_type: '', level: 'B1',
                        duration_minutes: 30, passing_score: 60, is_active: true,
                        is_skill_practice: false, skill: '',
                        sections: [this.blankSection()],
                        writing: { enabled: false, name: '', prompt: '', sample_answer: '' }
                    };
                    this.testBuilderError = '';
                    this.testBuilderOpen = true;
                },

                async editTest(test) {
                    try {
                        const data = await sbInvoke('admin-tests', { action: 'get', test_id: test.id });
                        if (!data.success) { this.showToast(data.message || 'تعذّر تحميل الاختبار'); return; }

                        this.testBuilder = {
                            id: data.test.id, title: data.test.title, description: data.test.description || '',
                            test_type: data.test.test_type, level: data.test.level,
                            duration_minutes: data.test.duration_minutes, passing_score: data.test.passing_score,
                            is_active: data.test.is_active, is_skill_practice: data.test.is_skill_practice,
                            skill: data.test.skill || '',
                            sections: data.sections.map(s => {
                                this.testKeyCounter++;
                                return {
                                    _key: 's' + this.testKeyCounter, key: s.key, name: s.name, type: s.type,
                                    official_duration_minutes: s.official_duration_minutes, instructions: s.instructions || '',
                                    passage: s.passage || '', audio_url: s.audio_url, audioUploading: false,
                                    questions: (s.test_questions || []).map(q => {
                                        this.testKeyCounter++;
                                        return {
                                            _key: 'q' + this.testKeyCounter, question_text: q.question_text,
                                            explanation: q.explanation || '', points: q.points || 1,
                                            answers: (q.test_answers || []).map(a => {
                                                this.testKeyCounter++;
                                                return { _key: 'a' + this.testKeyCounter, answer_text: a.answer_text, is_correct: a.is_correct };
                                            })
                                        };
                                    })
                                };
                            }),
                            writing: data.writing
                                ? { enabled: true, name: data.writing.name, prompt: data.writing.prompt, sample_answer: data.writing.sample_answer }
                                : { enabled: false, name: '', prompt: '', sample_answer: '' }
                        };
                        this.testBuilderError = '';
                        this.testBuilderOpen = true;
                    } catch (e) {
                        console.error(e);
                        this.showToast('تعذّر تحميل الاختبار');
                    }
                },

                addSection() { this.testBuilder.sections.push(this.blankSection()); },
                removeSection(i) { this.testBuilder.sections.splice(i, 1); },
                addQuestion(sIndex) { this.testBuilder.sections[sIndex].questions.push(this.blankQuestion()); },
                removeQuestion(sIndex, qIndex) { this.testBuilder.sections[sIndex].questions.splice(qIndex, 1); },

                addAnswer(sIndex, qIndex) {
                    this.testKeyCounter++;
                    this.testBuilder.sections[sIndex].questions[qIndex].answers.push({ _key: 'a' + this.testKeyCounter, answer_text: '', is_correct: false });
                },
                removeAnswer(sIndex, qIndex, aIndex) {
                    this.testBuilder.sections[sIndex].questions[qIndex].answers.splice(aIndex, 1);
                },
                setCorrectAnswer(sIndex, qIndex, aIndex) {
                    this.testBuilder.sections[sIndex].questions[qIndex].answers.forEach((a, i) => { a.is_correct = i === aIndex; });
                },

                async uploadSectionAudio(sIndex, file) {
                    if (!file) return;
                    const section = this.testBuilder.sections[sIndex];
                    section.audioUploading = true;
                    try {
                        const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
                        const path = `${crypto.randomUUID()}-${safeName}`;
                        const { error } = await sb.storage.from('test-audio').upload(path, file);
                        if (error) { this.showToast('تعذّر رفع الملف الصوتي'); return; }
                        section.audio_url = path;
                    } catch (e) {
                        console.error(e);
                        this.showToast('تعذّر رفع الملف الصوتي');
                    } finally {
                        section.audioUploading = false;
                    }
                },

                async saveTest() {
                    this.testBuilderError = '';
                    if (!this.testBuilder.title.trim() || !this.testBuilder.test_type.trim()) {
                        this.testBuilderError = 'العنوان ورمز نوع الاختبار مطلوبان';
                        return;
                    }
                    this.savingTest = true;
                    try {
                        const payload = {
                            id: this.testBuilder.id, title: this.testBuilder.title.trim(),
                            description: this.testBuilder.description, test_type: this.testBuilder.test_type.trim(),
                            level: this.testBuilder.level, duration_minutes: this.testBuilder.duration_minutes,
                            passing_score: this.testBuilder.passing_score, is_active: this.testBuilder.is_active,
                            is_skill_practice: this.testBuilder.is_skill_practice, skill: this.testBuilder.skill || null,
                            sections: this.testBuilder.sections.map((s, i) => ({
                                key: s.key || ('section' + (i + 1)), name: s.name, type: s.type,
                                official_duration_minutes: s.official_duration_minutes, instructions: s.instructions,
                                passage: s.passage, audio_url: s.audio_url,
                                questions: s.questions.map(q => ({
                                    question_text: q.question_text, explanation: q.explanation, points: q.points,
                                    answers: q.answers.map(a => ({ answer_text: a.answer_text, is_correct: a.is_correct }))
                                }))
                            })),
                            writing: this.testBuilder.writing
                        };

                        const data = await sbInvoke('admin-tests', { action: 'save', test: payload });
                        if (data.success) {
                            this.showToast('تم حفظ الاختبار');
                            this.testBuilderOpen = false;
                            this.loadTests();
                        } else {
                            this.testBuilderError = data.message || 'تعذّر حفظ الاختبار';
                        }
                    } catch (e) {
                        console.error(e);
                        this.testBuilderError = 'حدث خطأ أثناء الحفظ';
                    } finally {
                        this.savingTest = false;
                    }
                },

                async toggleTestActive(test) {
                    try {
                        const data = await sbInvoke('admin-tests', { action: 'toggle_active', test_id: test.id, is_active: !test.is_active });
                        if (data.success) { test.is_active = !test.is_active; }
                    } catch (e) { console.error(e); }
                },

                confirmDeleteTest(test) { this.deleteTestTarget = test; },

                async deleteTest() {
                    if (!this.deleteTestTarget) return;
                    try {
                        const data = await sbInvoke('admin-tests', { action: 'delete', test_id: this.deleteTestTarget.id });
                        if (data.success) {
                            this.showToast('تم حذف الاختبار');
                            this.deleteTestTarget = null;
                            this.loadTests();
                        }
                    } catch (e) { console.error(e); }
                },

                showToast(msg) {
                    this.toast = msg;
                    setTimeout(() => { this.toast = ''; }, 2600);
                },

                initials(name) {
                    if (!name) return '?';
                    const parts = name.trim().split(/\s+/);
                    return parts.length > 1 ? parts[0].charAt(0) + parts[1].charAt(0) : parts[0].charAt(0);
                },

                formatDate(iso) {
                    if (!iso) return '—';
                    const d = new Date(iso);
                    return d.toLocaleDateString('ar-MA', { year: 'numeric', month: 'short', day: 'numeric' });
                },

                statusLabel(status) {
                    return { pending: 'قيد المراجعة', active: 'نشط', rejected: 'مرفوض' }[status] || status;
                },

                statusBadgeClass(status) {
                    if (status === 'active') return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
                    if (status === 'rejected') return 'bg-red-50 text-red-600 border border-red-200';
                    return 'de-badge-gold';
                },

                audienceLabel(audience) {
                    return {
                        all: 'جميع الأعضاء', active: 'النشطون', pending: 'قيد المراجعة', rejected: 'المرفوضون'
                    }[audience] || audience;
                }
            };
        }
    </script>
</body>
</html>
